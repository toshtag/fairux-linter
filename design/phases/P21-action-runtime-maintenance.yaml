id: P21
name: GitHub Actions Node 24 runtime maintenance
weight: 2
confidence: high
risk: medium
status: done
objective: Remove the deprecated Node 20 action-runtime warnings without
  weakening immutable action pinning, publish privilege boundaries,
  package-manager selection, or release artifact handoff behavior.
definition_of_done:
  - Every pnpm/action-setup use is pinned by full SHA to an approved Node 24
    release
  - Every actions/download-artifact use is pinned by full SHA to an approved
    Node 24 release
  - The repository packageManager still selects pnpm 10.33.2, on Linux and on
    Windows
  - CLI and SDK release bundle artifact name, path, and extraction behavior are
    unchanged
  - No publish workflow, npm package, Git tag, or GitHub Release is executed
  - A pull-request CI run has zero Node 20 action-runtime warnings
  - "Issue #64 is closed by the merged pull request"
  - A CI run on the resulting main commit has zero Node 20 action-runtime
    warnings
verification:
  commands:
    - pnpm lint
    - pnpm build
    - pnpm check:build-output
    - pnpm lint
    - pnpm typecheck
    - pnpm test
    - pnpm check:runtime-safety
    - pnpm pack:smoke
    - pnpm pack:smoke:sdk
    - pnpm exec code-pact validate --json
    - pnpm exec code-pact plan lint --json
evidence:
  - "Selection, pnpm/action-setup: v5.0.0, tag dereferenced to
    fc06bc1257f339d1d5d8b3a19a8cae5388b55320, whose action.yml declares
    runs.using: node24. The retired b906affcce14559ad1aafd4ab0e942779e9f58b1 (v4)
    declared node20."
  - "Selection, actions/download-artifact: v7.0.0, tag dereferenced to
    37930b1c2abaa49bbe596cd826c3c89aef350131, whose action.yml declares
    runs.using: node24. The retired 634f93cb2916e3fdff6788551b99b062d0335ce0
    (v5.0.0) declared node20."
  - "Versions read and rejected: actions/download-artifact v6.0.0 declares
    runs.using: node20 at its own tag despite its release notes, so it does not
    resolve issue #64; v8 was not taken because v7 resolves it. pnpm/action-setup
    v6.0.9 was not taken because of an open pnpm 10 identity regression and an
    open security report against its bundled bootstrap pnpm. No workaround input,
    audit suppression, or forced version was added in place of either."
  - "Occurrences replaced: pnpm/action-setup 8 in ci.yml, 1 in publish-cli.yml,
    2 in publish-sdk.yml; actions/download-artifact 1 in publish-cli.yml, 1 in
    publish-sdk.yml. actions/upload-artifact@043fb46 (v7.0.1) already declared
    node24 and was not touched, nor were actions/checkout, actions/setup-node, or
    lycheeverse/lychee-action."
  - "Preserved contracts: neither action was given an input; the CLI artifact stays
    fairux-tarball and the SDK artifact stays fairux-sdk-tarball, both extracted to
    ${{ runner.temp }}/bundle; no permissions block, environment, OIDC grant, or
    job dependency changed outside the two new unprivileged canary jobs."
  - "Warning baseline, main run 30366988673 (2fe937f): 14 Node 20 action-runtime
    warnings, every one naming pnpm/action-setup@b906aff. The download action
    contributes no baseline warning because the publish workflows are tag-triggered
    and never run in pull-request CI, so its node20 runtime was read from action.yml
    at 634f93c rather than inferred from a log."
  - "Warning after, pull-request run 30403859251 (046d50c): 0. The log was scanned
    fail-closed for both 'Node.js 20 is deprecated' and 'forced to run on Node.js
    24'; the run's own success was not treated as proof. All 32 checks pass."
  - "Warning after, pull-request run 30404080712 on superseded pre-R1 head 7c71a93:
    0, scanned the same way, all checks green. It replaced the earlier 30403859251
    observation on 046d50c."
  - "R1 status-correction run 30417111283 on eacebf1: success, with zero fail-closed
    matches for either Node 20 action-runtime warning string. The pnpm selection
    assertions passed on Linux and Windows and the artifact handoff canary passed.
    Any subsequent R2 change is restricted to this phase metadata; the workflow, the
    pnpm-selection script, and the workflow contract test remain byte-for-byte
    identical to eacebf1. The authoritative terminal observation remains the
    post-merge main run required by the definition of done — a pre-merge head is
    always one amendment away from being superseded, so this evidence stops naming
    heads here rather than chasing each new one."
  - "pnpm selection observed, not asserted from the workflow text: 'pnpm 10.33.2
    selected from packageManager' printed by scripts/check-pnpm-selection.mjs in the
    verify job on ubuntu-latest and in the config-windows job on windows-latest,
    before either installed."
  - "Artifact canary: action-runtime-artifact-upload uploaded action-runtime-canary
    (198 bytes on the wire, artifact id 8705741876) through
    actions/upload-artifact@043fb46, and action-runtime-artifact-download extracted
    it through the new v7 pin and reported 'Artifact handoff OK: 1 file, contents
    unchanged' — the file set compared as well as the bytes."
  - "Contract test: tests/unit/workflows/action-runtime-contract.test.ts walks the
    workflow tree rather than known lines. Ten mutations were run against it and each
    is rejected: a reverted pin, a floated tag, a stale version comment, a deleted
    download step, a version input on the pnpm setup, an extra download input,
    id-token: write on a canary, a dropped Windows assertion, a changed
    packageManager, and a rename on one side of the artifact handoff."
  - "Write audit: task finalize P21-T1 --base-ref origin/main --audit-strict reports
    outside_declared [] and declared_unused []. P20's structural DECLARED_UNUSED
    exception does not apply — this branch carries the implementation."
  - "Writes deliberately not performed: no npm publish, no npm dist-tag, no git tag
    or tag push, no gh release create/edit/upload, and no manual dispatch of either
    publish workflow. The publish workflows were verified statically and through the
    pull-request canary."
  - "External closeout: PR #72 merged as 1672df95b591f52cb3fc1c90a8d089fb6d14f1ca at
    2026-07-29T04:24:42Z. Issue #64 was then observed CLOSED as COMPLETED at
    2026-07-29T04:24:43Z — read from the issue, not inferred from the pull request's
    'Closes #64' reference. Issue #69 remains OPEN and untouched."
  - "Terminal observation, main run 30422201019 on the merge commit
    1672df95b591f52cb3fc1c90a8d089fb6d14f1ca: success, and zero fail-closed matches
    for either Node 20 action-runtime warning string, against the 14 on the 2fe937f
    baseline. The scan was guarded before it was believed: the run's databaseId,
    headSha, conclusion, and event were compared against the merge commit; the log
    was required to be non-empty and to exceed 1,000 lines; and the same scan was
    required to find the two target Action pins in the log before a zero could mean
    anything. An earlier pull-request scan in this phase reported zero from an empty
    log after a failed run-id lookup, which is a fail-open check wearing a
    fail-closed result; these guards are what that mistake bought."
  - "Terminal observation counts, from one scanner over the run 30422201019 log so
    that each figure has a single stated unit. The log is 8,516 newline-delimited
    segments (wc -l reports 8,515; the difference is the trailing newline). The
    sanity guard found 415 log lines containing at least one of the two target Action
    pins. A separate exact-token occurrence count found 430 target references: 407
    pnpm/action-setup and 23 actions/download-artifact. These are different units —
    a line may carry a pin more than once — and are recorded separately rather than
    reconciled. Both are above zero, which is what the guard required."
  - "Reference-only control in the same scan: actions/upload-artifact@043fb46, which
    already declared node24 and was not changed by this phase, occurs 27 times as an
    exact token. Neither retired SHA — b906affcce14559ad1aafd4ab0e942779e9f58b1 or
    634f93cb2916e3fdff6788551b99b062d0335ce0 — occurs at all."
  - "Main-run job evidence: 'pnpm 10.33.2 selected from packageManager' printed in
    verify on ubuntu-latest and in config-windows on windows-latest; the canary
    uploaded action-runtime-canary through actions/upload-artifact@043fb46 and
    action-runtime-artifact-download extracted it through the new v7 pin, reporting
    'Artifact handoff OK: 1 file, contents unchanged'."
tasks:
  - id: P21-T1
    type: bugfix
    ambiguity: low
    risk: medium
    context_size: medium
    write_surface: medium
    verification_strength: strong
    expected_duration: medium
    status: done
    description: "Resolve issue #64 by replacing only the two Node 20 actions —
      pnpm/action-setup and actions/download-artifact — with releases whose own
      action.yml declares node24, pinned by the full commit SHA their tags
      dereference to. Version names and major aliases do not establish a
      runtime, so each candidate's action.yml is read at the pinned SHA and its
      inputs compared against the ones these workflows actually pass. The
      publish workflows are tag-triggered and therefore invisible to
      pull-request CI, so the download action's contract is proved by an
      unprivileged canary that uploads a deterministic file and downloads it
      through the new pin, and pnpm's selection is proved by asserting the
      running version against packageManager on Linux and on Windows before
      anything installs. A workflow contract test walks the whole workflow tree
      rather than known line numbers, so an unapproved pin added anywhere fails,
      and so does the target action disappearing entirely."
    reads:
      - .github/workflows/**
      - tests/unit/workflows/**
      - docs/github-actions.md
      - docs/status.md
      - package.json
    writes:
      - .github/workflows/ci.yml
      - .github/workflows/publish-cli.yml
      - .github/workflows/publish-sdk.yml
      - scripts/check-pnpm-selection.mjs
      - tests/unit/workflows/**
      - docs/github-actions.md
      - docs/status.md
      - CHANGELOG.md
      - design/phases/P21-action-runtime-maintenance.yaml
      - design/roadmap.yaml
