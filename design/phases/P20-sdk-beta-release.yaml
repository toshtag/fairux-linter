id: P20
name: SDK beta release
weight: 10
confidence: medium
risk: high
status: in_progress
objective: Publish the first npm beta for @fairux/sdk and the CLI only after
  registry, provenance, GitHub Release, and clean-install verification pass.
definition_of_done:
  - P13-T2 taxonomy hardening and P13-T3 migration or authoring notes are
    complete
  - "Issue #57 is resolved before release execution starts: pnpm build leaves
    the worktree clean, pnpm lint succeeds after a build, and declarations are
    emitted only under each package dist directory"
  - A local SDK tarball clean-install consumer proves HTML, browser DOM, root
    scanner, custom taxonomy, and external page-context integration before
    publish
  - "@fairux/sdk@0.1.0-beta.2 is installable from the npm registry"
  - fairux@0.1.0-beta.1 is installable if the CLI is released in the same wave
  - GitHub Release, changelog, package versions, and npm versions match
  - Trusted publishing or equivalent provenance is configured and documented
  - Clean temporary consumers run HTML, DOM, and custom RulePack smoke tests
  - Browser bundling of @fairux/sdk/dom succeeds from the registry package
  - Node.js 22.18.0 and the supported 24.x floor both pass release smoke tests
  - No workspace specifiers or private source payloads appear in published
    tarballs
verification:
  commands:
    - pnpm lint
    - pnpm build
    - pnpm check:build-output
    - pnpm lint
    - pnpm typecheck
    - pnpm test
    - pnpm check:runtime-safety
    - pnpm pack:smoke
    - pnpm pack:smoke:sdk
    - pnpm exec code-pact validate --json
    - pnpm exec code-pact plan lint --json
tasks:
  - id: P20-T0
    type: feature
    ambiguity: medium
    risk: high
    context_size: medium
    write_surface: medium
    verification_strength: strong
    expected_duration: medium
    status: done
    description: Prove a clean temporary consumer installed from the locally
      generated SDK tarball before publishing, covering HTML, browser DOM, root
      scanner, custom taxonomy, and external page contexts without workspace
      package imports.
    reads:
      - packages/sdk/**
      - tests/fixtures/**
    writes:
      - tests/fixtures/**
      - docs/**
  - id: P20-T1
    type: feature
    ambiguity: medium
    risk: high
    context_size: medium
    write_surface: medium
    verification_strength: strong
    expected_duration: medium
    status: done
    description: Prepare npm trusted publishing, release notes, provenance evidence,
      and clean registry-install verification for the SDK beta release.
    reads:
      - packages/sdk/**
      - apps/cli/**
      - .github/**
      - docs/**
      - CHANGELOG.md
    writes:
      - packages/sdk/**
      - apps/cli/**
      - .github/**
      - docs/**
      - CHANGELOG.md
      - package.json
  - id: P20-T2
    type: feature
    ambiguity: medium
    risk: high
    context_size: medium
    write_surface: medium
    verification_strength: strong
    expected_duration: medium
    status: done
    description: Make SDK release preflight fail-closed, source-map aware,
      registry-verifiable, and safely rerunnable after partial publication.
    reads:
      - packages/sdk/**
      - .github/workflows/**
      - docs/**
      - package.json
      - tests/unit/workflows/**
    writes:
      - packages/sdk/**
      - .github/workflows/**
      - docs/**
      - package.json
      - tests/unit/workflows/**
      - design/phases/P20-sdk-beta-release.yaml
  - id: P20-T3
    type: refactor
    ambiguity: medium
    risk: high
    context_size: medium
    write_surface: medium
    verification_strength: strong
    expected_duration: medium
    status: done
    description: "Resolve issue #57 so declaration emit is deterministic and
      release-safe. A build must leave the worktree clean, lint must succeed
      after a build, repeated builds must be identical, and declarations must be
      emitted only under the dist directory of a workspace discovered from its
      manifest, enforced by a fail-closed build-output invariant that refuses
      any file below a dist directory that is not such an output directory,
      whose allowances come from real identities — manifest-discovered
      workspaces and Git-tracked source paths — rather than path shape, that
      does not rely on git status, aborts rather than passing when a directory
      or the Git index cannot be read, and runs in CI on both supported Node.js
      floors. The workspace boundary must be enforced via rootDir on the
      compiler's resolved program rather than by scanning source for import
      syntax, and verified against the TS6059 diagnostic itself."
    reads:
      - tsconfig.base.json
      - packages/**
      - apps/**
      - scripts/**
      - .github/workflows/**
      - docs/**
      - package.json
    writes:
      - tsconfig.base.json
      - packages/**
      - apps/**
      - scripts/**
      - tests/unit/**
      - .github/workflows/**
      - docs/**
      - CHANGELOG.md
      - package.json
      - pnpm-lock.yaml
      - design/phases/P20-sdk-beta-release.yaml
  - id: P20-T4
    type: bugfix
    ambiguity: low
    risk: high
    context_size: medium
    write_surface: medium
    verification_strength: strong
    expected_duration: medium
    status: done
    description: "Resolve issue #62 so post-publish registry verification tolerates
      a bounded visibility delay without weakening any digest check. Only an
      absent version may be retried, under a deterministic backoff schedule
      bounded by an absolute deadline of 120 seconds that covers the registry
      reads as well as the sleeps — each read limited to the remaining deadline,
      measured on a monotonic clock, with no read or sleep started that the
      deadline cannot cover; a shasum mismatch, an integrity mismatch, malformed
      metadata, and a failed read must each fail on the first observation. The
      wait is an explicit opt-in valid only alongside the post-publish presence
      requirement, so the pre-publish plan stays a single read, and workflow
      contract tests must reject both losing the wait after publish and gaining
      it before. Prove the published @fairux/sdk@0.1.0-beta.2 through clean
      public-registry installs on Node.js 22.18.0 and 24.11.0 with no local
      tarball fallback."
    reads:
      - packages/sdk/**
      - .github/workflows/**
      - tests/unit/workflows/**
      - scripts/**
      - docs/**
      - CHANGELOG.md
      - package.json
    writes:
      - packages/sdk/**
      - .github/workflows/**
      - tests/unit/workflows/**
      - docs/**
      - CHANGELOG.md
      - design/phases/P20-sdk-beta-release.yaml
  - id: P20-T5
    type: bugfix
    ambiguity: low
    risk: medium
    context_size: small
    write_surface: low
    verification_strength: strong
    expected_duration: short
    status: done
    description: Replace the one-time pre-publication status literal with a durable,
      version-scoped SDK publication-state contract. The release check required
      the words "has not been published to npm", which only held before a first
      release; replacing it with a search for either phrase proved neither
      uniqueness nor that the claim was about the version being released — two
      identical claims passed, and so did a claim about 0.1.0-beta.1 while
      0.1.0-beta.2 appeared elsewhere in the prose. The status document must
      carry exactly one machine-readable publication record, for the exact
      source package version, in a state that is exactly published or
      unpublished, and a parser must reject duplicates, conflicting states,
      records for another version, unknown states, and more than one such table.
      Registry truth stays with the registry reader; this contract only fixes
      what the document says.
    reads:
      - packages/sdk/scripts/**
      - packages/sdk/test/**
      - docs/status.md
      - design/phases/P20-sdk-beta-release.yaml
      - package.json
    writes:
      - packages/sdk/scripts/**
      - packages/sdk/test/**
      - docs/status.md
      - docs/sdk-beta-release.md
      - CHANGELOG.md
      - design/phases/P20-sdk-beta-release.yaml
  - id: P20-T6
    type: bugfix
    ambiguity: low
    risk: medium
    context_size: small
    write_surface: low
    verification_strength: strong
    expected_duration: short
    status: done
    description: "Make the SDK publication-state parser read only a live canonical
      Markdown section. It scanned raw lines, so a record inside a fenced code
      block or an HTML comment satisfied the release check while no canonical
      record existed outside that context, and a two-column header with a
      three-column separator passed as a well-formed table. Fenced and commented
      regions must be excluded — and so must indented code, the raw-text blocks
      script, pre, style, and textarea, processing instructions, declarations,
      CDATA, and any other HTML block until the blank line that ends it, with an
      unclosed block within those enumerated contexts keeping every later line
      skipped. HTML comment delimiters must be tracked in order across a line,
      so a closed comment cannot mask an unclosed one that follows it. The
      canonical heading and its table must each appear exactly once among the
      non-skipped lines, a second live publication table must be refused, and
      the separator's column count must equal the header's. The canonical
      heading and every table row must start at column zero: Markdown's
      up-to-three-space allowance cannot be told apart from list-continuation
      indent, so a record nested under a list item satisfied the check while
      being that item's content rather than the document's own statement, and
      this contract is narrower than Markdown rather than parsing list nesting.
      The scanner skips the opaque source contexts it recognises; it is not a
      Markdown renderer, an HTML parser, or a check on what a browser displays,
      and the contract says so. Correct the remaining pre-publication consumer
      guidance, which still routes external products to a workspace link or a
      local tarball while the beta is installable from public npm."
    reads:
      - packages/sdk/scripts/sdk-publication-status.mjs
      - packages/sdk/scripts/sdk-publication-status.d.mts
      - packages/sdk/test/sdk-publication-status.test.ts
      - docs/status.md
      - CHANGELOG.md
      - design/phases/P20-sdk-beta-release.yaml
    writes:
      - packages/sdk/scripts/**
      - packages/sdk/test/**
      - docs/status.md
      - CHANGELOG.md
      - design/phases/P20-sdk-beta-release.yaml
  - id: P20-T7
    type: bugfix
    ambiguity: medium
    risk: medium
    context_size: medium
    write_surface: medium
    verification_strength: strong
    expected_duration: medium
    status: done
    description: "Resolve issue #63 so the SDK's GitHub Release describes the
      published beta to a prospective user. The notes were a flat bullet list
      that told a reader to install after publication, pinned an exact version
      instead of the beta channel, and explained neither the public entry
      points, the provenance, nor the two attached assets; the release title
      carried a duplicated v against the package version, and the SDK README
      still called the package an unpublished preview. Release notes become a
      pure generator plus a thin CLI main guard whose release-variable facts
      come only from the trusted checkout manifest and from values the
      privileged publish job already verified, with the explanatory copy kept as
      version-controlled text whose load-bearing claims are pinned by semantic
      tests rather than claimed as derived. It fails closed on a package name,
      tag, dist-tag, tarball name, checksum name, entry-point set, repository
      URL, or control character that is not the expected one, including a
      version it would misdescribe as a beta — a presentation guard only,
      leaving publish eligibility untouched, since issue #63 is presentation
      only. The public READMEs are brought in line with the same determinism
      boundary the notes state, and the existing Release is described from the
      manifest at the commit resolved from its tag, rather than from the Release
      API's target_commitish branch or from current main. The documentation
      links are pinned to this repository rather than to any URL of the right
      shape. The in-place correction requires every compared identity field to
      be present before it is compared, validates the expected Release, npm, and
      dist-tag state, then re-reads them and compares an enumerated immutable
      projection plus the corrected title and body. Absence is a failure rather
      than a match: the first form of that check passed a capture whose assets
      carried only names, and a later one passed a Release still carrying the
      old title because nothing looked at it. The release target is resolved
      from the annotated tag GitHub holds, dereferenced to its commit, since
      target_commitish holds a branch name; the correction runs as one shell
      block under set -euo pipefail with the GitHub host, repository, and both
      npm registry keys named explicitly. Structured sections appear exactly
      once each in a fixed order, the install command names the next dist-tag,
      Node support is read from engines.node, and the trust section keeps npm's
      dist.integrity, the GitHub Release SHA-256 file, and third-party RulePack
      execution as separate claims rather than one. Update the existing
      sdk-v0.1.0-beta.2 Release in place after merge without moving its tag or
      target, changing npm state, or deleting, replacing, or re-uploading either
      asset."
    reads:
      - packages/sdk/package.json
      - packages/sdk/README.md
      - packages/sdk/scripts/**
      - packages/sdk/test/**
      - scripts/release-bundle-contract.mjs
      - .github/workflows/publish-sdk.yml
      - tests/unit/workflows/**
      - docs/status.md
      - docs/sdk-beta-release.md
      - CHANGELOG.md
    writes:
      - packages/sdk/README.md
      - packages/sdk/scripts/**
      - scripts/check-sdk-release-state.mjs
      - scripts/check-sdk-release-state.d.mts
      - packages/sdk/test/**
      - .github/workflows/publish-sdk.yml
      - tests/unit/workflows/**
      - README.md
      - docs/status.md
      - docs/sdk-beta-release.md
      - CHANGELOG.md
      - design/phases/P20-sdk-beta-release.yaml
  - id: P20-T8
    type: bugfix
    ambiguity: low
    risk: medium
    context_size: small
    write_surface: low
    verification_strength: strong
    expected_duration: short
    status: in_progress
    description: "Resolve issue #68 so the SDK release path means beta wherever it
      says beta. Four gates described themselves as beta-only while testing
      something weaker: the workflow's tag validation, the bundle assembler, and
      the bundle verifier each read a prerelease boolean, and the release check
      asked only whether the version contained a hyphen. 0.1.0-alpha.1,
      0.1.0-rc.1, and the purely numeric 0.1.0-1 satisfied all four, so one
      release invariant carried four meanings and a non-beta tag proceeded
      through a dependency install and a full dry-run pack before anything
      refused it. One shared isBetaPrerelease contract now backs every SDK gate,
      and the earliest of them is a script whose exit status a test can read
      rather than an inline expression, running in the validate job that every
      other job needs. The repository-wide stable-is-latest, prerelease-is-next
      dist-tag policy, which also governs the CLI, is unchanged."
    reads:
      - scripts/release-version-contract.mjs
      - scripts/release-bundle-contract.mjs
      - scripts/assemble-release-bundle.mjs
      - packages/sdk/scripts/release-check.mjs
      - .github/workflows/publish-sdk.yml
      - tests/unit/**
    writes:
      - scripts/**
      - packages/sdk/scripts/release-check.mjs
      - .github/workflows/publish-sdk.yml
      - tests/unit/**
      - CHANGELOG.md
      - design/phases/P20-sdk-beta-release.yaml
