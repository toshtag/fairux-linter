name: Probe
on:
  push:
    branches: [perf/building-what-the-tests-do-not-run]
permissions:
  contents: read
jobs:
  arm-everything:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: node scripts/check-pnpm-selection.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:doc-references
      - run: pnpm check:third-party-fixtures
      - run: pnpm build
      - run: pnpm check:build-output
      - run: pnpm lint
      - run: pnpm typecheck:built
      - run: pnpm check:runtime-safety
      - run: pnpm rules:reviews:check:built
      - run: pnpm rules:catalog:check:built
      - run: pnpm eval:corpus:check:built
      - run: pnpm calibrate:risk-index:check:built
      - run: pnpm api:inventory:check:built
      - name: whole suite, unsharded
        run: pnpm test:built
      - name: Assert the worktree is clean
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
