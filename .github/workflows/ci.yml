name: CI

# What a contributor waits for, and nothing else.
#
# Three jobs, run at the same time, each answering one question about the change in front of you:
# does the tree still build and typecheck, do the tests still pass, and do the generated artifacts
# still agree with what generated them. The release rehearsals and the Windows platform checks used
# to be here too; they are in `release-contract.yml` now, on `main`, because none of them can be
# broken by a change that has not been merged yet.
on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes. Naming the permission fixes it, rather than inheriting whatever a repository
# or organisation default grants.
permissions:
  contents: read

# A pull request that moved on does not need its old run finished — five pushes to a branch used to
# mean five full runs, of which four were reporting on a tree that no longer existed. On `main` it
# is the opposite: that run is the record for a commit nobody is going to push over.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The Node this lane installs is 22.23.1, not the 22.18.0 floor, and that is a speed decision with
# a measurement behind it. `actions/setup-node` resolves from the runner image's tool cache when the
# exact version is there and downloads a tarball when it is not. The image carries 22.23.1 and
# 24.18.0; neither declared floor is in it, so every job here spent about five seconds acquiring and
# extracting Node before it could do anything — six jobs, on every push, for a runtime the release
# lane already proves.
#
# Still an exact version. A floating `22` would resolve from the cache too, and this repository does
# not use mutable aliases: `action-runtime-contract.test.ts` refuses them for actions on the grounds
# that what a name points at can change without this repository changing, and a runtime is no
# different. When the image moves past 22.23.1 this goes back to a five-second download — slower,
# never wrong — and the fix is to re-read `/opt/hostedtoolcache/node` and pick the new one.
#
# What the floors mean is unchanged. `release-contract.yml`'s `suite-on-both-floors` runs the whole
# suite on 22.18.0 and 24.11.0 after every merge, and `supported-platforms-contract.test.ts` fails
# if it stops. This lane now also observes a 22.x from the middle of the supported range, which
# `docs/reference/platforms.md` previously listed as untested.
env:
  # One place, so the six jobs below cannot drift apart.
  PR_LANE_NODE: 22.23.1

# `ubuntu-24.04-arm`, not `ubuntu-latest`. GitHub gives public repositories arm64 runners at no
# cost, and on the same four cores and 15GB they are faster at what this lane does: the whole suite
# unsharded is 25s against 28–33s, `pnpm build` 3s against 4s, a shard 6s against 8–11s. The image
# carries the same 22.23.1 in its tool cache, so nothing about the Node pin changes.
#
# Everything here is ES modules and JSON; the only native code in reach is the toolchain — rolldown,
# Biome, esbuild — and each ships a linux-arm64 build, which is why this works at all rather than
# because the tests are architecture-agnostic in principle.
#
# x64 does not lose a check. `release-contract.yml` runs on `ubuntu-latest` and Windows after every
# merge, and its `suite-on-both-floors` job runs the whole suite there on both Node floors. So the
# architectures observed went from one to two rather than moving from one to another; see
# `docs/reference/platforms.md`.

jobs:
  # Everything that needs one build and is not the test suite: the tree lints, builds, emits only
  # what it is allowed to, typechecks, keeps `@fairux/core` and `@fairux/rules` free of Node
  # built-ins, and still agrees with every artifact checked in beside it.
  #
  # One job rather than two because both began with the same eleven seconds — a checkout, a pnpm, a
  # Node, an install, a build — to do four seconds of work each. Splitting them cost a second full
  # setup and an extra draw from a runner pool that takes 2 to 15 seconds to answer, and bought
  # nothing: neither half was the slowest job in the run.
  verify:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.PR_LANE_NODE }}
          cache: pnpm
      # Before the install, so a pnpm that is not the one `packageManager` names can't resolve the
      # lockfile first and be found out later. `pnpm/action-setup` is passed no `version` input.
      - run: node scripts/check-pnpm-selection.mjs
      - run: pnpm install --frozen-lockfile
      # These two need nothing built, so they go before the build: a document naming a script that
      # is gone, or a corpus page whose licence record went missing, fails within seconds.
      #
      # Documents name two things the link checker cannot see: a command to run and a file to read.
      # Both survived being removed once, and readers were told to run and open them for a release.
      - run: pnpm check:doc-references
      # Six corpus pages this project did not write are here because their licences permit it. This
      # fails, rather than reports, because a fixture whose provenance goes missing is a licence
      # problem — and because it is what stops one being edited until a rule agrees with it.
      - run: pnpm check:third-party-fixtures
      # Build before typecheck: cross-package types resolve from each dependency's built dist.
      - run: pnpm build
      - run: pnpm check:build-output
      # Lint *after* the build, and only after it. Issue #57 was a build that emitted files the next
      # lint then failed on, which the old lint-then-build order could never catch — so this run is
      # the one that matters, and it covers the checked-in tree too. A second lint in front of the
      # build re-read the same files to say the same thing.
      - run: pnpm lint
      # `typecheck:built`, not `typecheck`: the second is the first with `pnpm build` in front of it,
      # for a local run from a cold checkout. The build above already happened.
      - run: pnpm typecheck:built
      - run: pnpm check:runtime-safety
      # Everything checked in that something else generates, against the build above. These fail on
      # drift rather than on a threshold: what the numbers should be is a maintainer's call, but a
      # change to them has to arrive as a diff somebody reads rather than as a surprise later.
      # A rule change has to arrive as a deliberate one: the review records validate, and the
      # checked-in baseline still agrees with the built rules. Change what a rule matches without
      # bumping its version and saying why, and this fails with the command that fixes it.
      - run: pnpm rules:reviews:check:built
      - run: pnpm rules:catalog:check:built
      # Detection quality against the labelled corpus.
      - run: pnpm eval:corpus:check:built
      # The Risk Index calibration. Fails on drift, and separately when the separation claim breaks:
      # a committed artifact recording a failed separation would otherwise pass a freshness check
      # and ship a number that ranks a clean page above a bad one.
      - run: pnpm calibrate:risk-index:check:built
      # The published SDK surface. This fails only on a removal or a rename — an addition is
      # reported and left to the worktree-cleanliness gate below, which turns it into a diff
      # somebody reads rather than a red check somebody reruns.
      - run: pnpm api:inventory:check:built
      - name: Assert the generated artifacts are the ones checked in
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"


  # The suite in quarters, and four is where it stops mattering.
  #
  # Locally, on four workers because that is what the runner has, the slowest shard is 12.3s at four
  # and 7.6s at six — which is why this was six for a day. On the runner it is not: eight wall-clock
  # samples of each, same tree, same hour, came to a mean of 35.5s either way. The test step is no
  # longer what the run waits on. Two more jobs is two more allocations from a pool that took 2–15s
  # to place them, and that is the term that got bigger.
  #
  # So: four, because it is the same speed with two fewer runners. If the suite grows enough that a
  # shard becomes the slowest job again, measure before adding a fifth — this was true in a
  # benchmark and false on the machine that matters.
  test:
    name: test (${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.PR_LANE_NODE }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:built --shard=${{ matrix.shard }}/3
      # A test that writes into the worktree passes on the machine that wrote the file and fails on
      # the next checkout. This is where that gets found.
      - name: Assert the tests left the worktree clean
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
