name: Publish CLI

on:
  push:
    tags:
      - "v*"

# Trusted Publishing via OIDC — no npm tokens to leak.
# Trusted Publishing via OIDC. No npm tokens are expected or required.
permissions:
  contents: read


jobs:
  # Tag assertions before any job installs a dependency or runs a repository script.
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Validate tag-version consistency
        run: |
          TAG_VERSION="${{ github.ref_name }}"
          TAG_VERSION="${TAG_VERSION#v}"
          PKG_VERSION=$(node -p "require('./apps/cli/package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "ERROR: git tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "Version consistency OK: $PKG_VERSION"

          # Check if tag commit is in main branch
          TAG_COMMIT="${{ github.sha }}"
          git fetch origin main
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "ERROR: Tag commit ($TAG_COMMIT) is not in main branch"
            exit 1
          fi
          echo "Main containment OK: tag commit is in main"

          # Determine dist-tag based on version
          if [[ "$TAG_VERSION" =~ -[a-zA-Z] ]]; then
            DIST_TAG="next"
            echo "Prerelease version detected, will use 'next' dist-tag"
          else
            DIST_TAG="latest"
            echo "Stable version detected, will use 'latest' dist-tag"
          fi
          echo "DIST_TAG=$DIST_TAG" >> "$GITHUB_ENV"


  # Unprivileged artifact preparation: `pnpm install` and `prepack` run dependency and package
  # lifecycle scripts here, where there is no OIDC token to mint and no write access to use.
  prepare:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.11.0
          cache: pnpm

      - name: Resolve CLI release identity
        run: |
          PKG_VERSION=$(node -p "require('./apps/cli/package.json').version")
          if [[ "$PKG_VERSION" =~ -[a-zA-Z] ]]; then DIST_TAG="next"; else DIST_TAG="latest"; fi
          echo "CLI_VERSION=$PKG_VERSION" >> "$GITHUB_ENV"
          echo "DIST_TAG=$DIST_TAG" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile

      # Pack ONCE — this is the single artifact that ships. prepack builds the CLI and workspace
      # deps and copies LICENSE/NOTICE.
      - name: Pack the tarball
        run: |
          pnpm --filter fairux pack --pack-destination "$RUNNER_TEMP"
          mapfile -t TARBALLS < <(find "$RUNNER_TEMP" -maxdepth 1 -name "fairux-*.tgz" -type f | sort)
          if [ "${#TARBALLS[@]}" -ne 1 ]; then
            echo "ERROR: expected exactly one CLI tarball, got ${#TARBALLS[@]}"
            exit 1
          fi
          TARBALL="${TARBALLS[0]}"
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"
          node -e '
            const { createHash } = require("node:crypto");
            const { appendFileSync, readFileSync, writeFileSync } = require("node:fs");
            const { basename } = require("node:path");
            const bytes = readFileSync(process.env.TARBALL);
            const sha1 = createHash("sha1").update(bytes).digest("hex");
            const sha256 = createHash("sha256").update(bytes).digest("hex");
            const integrity = "sha512-" + createHash("sha512").update(bytes).digest("base64");
            appendFileSync(process.env.GITHUB_ENV, `SHA1=${sha1}\nSHA256=${sha256}\nINTEGRITY=${integrity}\n`);
            writeFileSync(`${process.env.RUNNER_TEMP}/tarball-sha256.txt`, `${sha256}  ${basename(process.env.TARBALL)}\n`);
          '

      - name: Smoke-test the exact tarball
        run: pnpm pack:smoke
        env:
          TARBALL: ${{ env.TARBALL }}
          EXPECTED_SHA256: ${{ env.SHA256 }}

      - name: Verify tarball integrity
        run: |
          ACTUAL_SHA256=$(node -e 'const { createHash } = require("node:crypto"); const { readFileSync } = require("node:fs"); process.stdout.write(createHash("sha256").update(readFileSync(process.env.TARBALL)).digest("hex"));')
          if [ "$ACTUAL_SHA256" != "$SHA256" ]; then
            echo "ERROR: SHA-256 mismatch after smoke test"
            exit 1
          fi
          echo "SHA-256 verified: $ACTUAL_SHA256"

      - name: Write release metadata
        run: |
          node -e '
            const { writeFileSync } = require("node:fs");
            writeFileSync(process.argv[1], JSON.stringify({
              package: "fairux",
              version: process.env.CLI_VERSION,
              spec: `fairux@${process.env.CLI_VERSION}`,
              distTag: process.env.DIST_TAG,
              sha1: process.env.SHA1,
              sha256: process.env.SHA256,
              integrity: process.env.INTEGRITY,
              tag: process.env.GITHUB_REF_NAME,
              commit: process.env.GITHUB_SHA,
              tarball: require("node:path").basename(process.env.TARBALL),
            }, null, 2) + "\n");
          ' "$RUNNER_TEMP/release-metadata.json"
          cat "$RUNNER_TEMP/release-metadata.json"

      - name: Upload release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fairux-tarball
          path: |
            ${{ env.TARBALL }}
            ${{ runner.temp }}/tarball-sha256.txt
            ${{ runner.temp }}/release-metadata.json
          retention-days: 30

  # The only privileged job: no install, no build, no pack, no package lifecycle. It downloads the
  # audited bundle, re-derives its digests, and publishes. `contents` stays read — the CLI workflow
  # creates no GitHub Release.
  publish:
    runs-on: ubuntu-latest
    needs: [validate, prepare]
    environment: publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.11.0

      - name: Verify publish Node runtime
        run: |
          node --version
          npm --version
          node -e 'const [major, minor] = process.versions.node.split(".").map(Number); if (major !== 24 || minor < 11) throw new Error("Expected Node 24.11.0 or newer on the Node 24 publish line, got " + process.versions.node);'

      - name: Download release bundle
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: fairux-tarball
          path: ${{ runner.temp }}/bundle

      - name: Verify release bundle
        run: |
          eval "$(node scripts/verify-release-bundle.mjs \
            --bundle "$RUNNER_TEMP/bundle" \
            --tag "${{ github.ref_name }}" \
            --commit "${{ github.sha }}" \
            --package-json apps/cli/package.json \
            --github-env "$GITHUB_ENV")"

      # Nothing may sit between this and the publish.
      - name: Verify npm Trusted Publishing prerequisites
        run: node scripts/check-trusted-publishing.mjs

      - name: Publish to npm
        run: |
          npm publish \
            --registry=https://registry.npmjs.org/ \
            --ignore-scripts \
            --provenance \
            --tag "$DIST_TAG" \
            "$TARBALL"
