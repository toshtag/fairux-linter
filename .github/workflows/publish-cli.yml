name: Publish CLI

on:
  push:
    tags:
      - "v*"

# Trusted Publishing via OIDC — no npm tokens to leak.
# Trusted Publishing via OIDC. No npm tokens are expected or required.
permissions:
  contents: read


jobs:
  # Tag assertions before any job installs a dependency or runs a repository script.
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Validate tag-version consistency
        run: |
          TAG_VERSION="${{ github.ref_name }}"
          TAG_VERSION="${TAG_VERSION#v}"
          PKG_VERSION=$(node -p "require('./apps/cli/package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "ERROR: git tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "Version consistency OK: $PKG_VERSION"

          # Check if tag commit is in main branch
          TAG_COMMIT="${{ github.sha }}"
          git fetch origin main
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "ERROR: Tag commit ($TAG_COMMIT) is not in main branch"
            exit 1
          fi
          echo "Main containment OK: tag commit is in main"

          # Strict SemVer via the shared helper. The shell test this replaced looked for a letter
          # after the hyphen, so it called `1.0.0-1` stable and would have pushed it to `latest`.
          # The publish job derives the dist-tag again from its own checkout — this is the early,
          # human-readable report of the same decision.
          node --input-type=module -e '
            import { distTagFor } from "./scripts/release-version-contract.mjs";
            const distTag = distTagFor(process.argv[1]);
            if (!distTag) throw new Error("tag version is not valid SemVer: " + process.argv[1]);
            console.log(`dist-tag for ${process.argv[1]}: ${distTag}`);
          ' "$TAG_VERSION"


  # Unprivileged artifact preparation: `pnpm install` and `prepack` run dependency and package
  # lifecycle scripts here, where there is no OIDC token to mint and no write access to use.
  prepare:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.11.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Pack ONCE — this is the single artifact that ships. prepack builds the CLI and workspace
      # deps and copies LICENSE/NOTICE.
      - name: Pack the tarball
        run: |
          pnpm --filter fairux pack --pack-destination "$RUNNER_TEMP"
          mapfile -t TARBALLS < <(find "$RUNNER_TEMP" -maxdepth 1 -name "fairux-*.tgz" -type f | sort)
          if [ "${#TARBALLS[@]}" -ne 1 ]; then
            echo "ERROR: expected exactly one CLI tarball, got ${#TARBALLS[@]}"
            exit 1
          fi
          echo "PACKED_TARBALL=${TARBALLS[0]}" >> "$GITHUB_ENV"

      # Same assembler as the SDK workflow, so both bundles have one shape and one owner.
      - name: Assemble release bundle
        run: |
          node scripts/assemble-release-bundle.mjs \
            --kind cli \
            --tarball "$PACKED_TARBALL" \
            --manifest apps/cli/package.json \
            --tag "${{ github.ref_name }}" \
            --commit "${{ github.sha }}" \
            --out "$RUNNER_TEMP/bundle" \
            --env-file "$GITHUB_ENV"

      - name: Smoke-test the exact tarball
        run: pnpm pack:smoke
        env:
          TARBALL: ${{ env.TARBALL }}
          EXPECTED_SHA256: ${{ env.SHA256 }}

      - name: Verify tarball integrity
        run: |
          ACTUAL_SHA256=$(node -e 'const { createHash } = require("node:crypto"); const { readFileSync } = require("node:fs"); process.stdout.write(createHash("sha256").update(readFileSync(process.env.TARBALL)).digest("hex"));')
          if [ "$ACTUAL_SHA256" != "$SHA256" ]; then
            echo "ERROR: SHA-256 mismatch after smoke test"
            exit 1
          fi
          echo "SHA-256 verified: $ACTUAL_SHA256"

      - name: Upload release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fairux-tarball
          path: ${{ env.BUNDLE_DIR }}
          if-no-files-found: error
          retention-days: 30

  # The only privileged job: no install, no build, no pack, no package lifecycle. It downloads the
  # audited bundle, re-derives its digests, and publishes. `contents` stays read — the CLI workflow
  # creates no GitHub Release.
  publish:
    runs-on: ubuntu-latest
    needs: [validate, prepare]
    environment: publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.11.0

      - name: Verify publish Node runtime
        run: |
          node --version
          npm --version
          node -e 'const [major, minor] = process.versions.node.split(".").map(Number); if (major !== 24 || minor < 11) throw new Error("Expected Node 24.11.0 or newer on the Node 24 publish line, got " + process.versions.node);'

      - name: Download release bundle
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: fairux-tarball
          path: ${{ runner.temp }}/bundle

      # Untrusted input: the bundle was built by a job that ran lifecycle code. Expected tag,
      # dist-tag, tarball name, and file set are derived from this clean checkout; digests are
      # recomputed from the bytes; only inert values reach GITHUB_ENV. Never `eval`ed.
      - name: Verify release bundle
        run: |
          node scripts/verify-release-bundle.mjs \
            --kind cli \
            --bundle "$RUNNER_TEMP/bundle" \
            --tag "${{ github.ref_name }}" \
            --commit "${{ github.sha }}" \
            --package-json apps/cli/package.json \
            --github-env "$GITHUB_ENV"

      - name: Audit tarball contents from the trusted checkout
        env:
          TARBALL: ${{ env.TARBALL }}
        run: node apps/cli/scripts/audit-packed-tarball.mjs

      - name: Re-verify tarball digest after the audit
        run: |
          ACTUAL=$(node -e 'const { createHash } = require("node:crypto"); const { readFileSync } = require("node:fs"); process.stdout.write(createHash("sha256").update(readFileSync(process.env.TARBALL)).digest("hex"));')
          if [ "$ACTUAL" != "$SHA256" ]; then
            echo "ERROR: tarball changed during the content audit"
            exit 1
          fi
          echo "SHA-256 stable across the audit: $ACTUAL"

      # Nothing may sit between this and the publish.
      - name: Verify npm Trusted Publishing prerequisites
        run: node scripts/check-trusted-publishing.mjs

      - name: Publish to npm
        run: |
          npm publish \
            --registry=https://registry.npmjs.org/ \
            --ignore-scripts \
            --provenance \
            --tag "$DIST_TAG" \
            "$TARBALL"
