name: Publish SDK

on:
  push:
    tags:
      - "sdk-v*"

# Trusted Publishing via OIDC. No npm tokens are expected or required.
#
# Least privilege by default: only the publish job may write contents or mint an OIDC token.
# Granting both workflow-wide would have handed them to `sdk-smoke`, which installs dependencies
# and runs repository scripts from the tagged commit and needs neither.
permissions:
  contents: read

jobs:
  # Cheap assertions about the tag itself, before any job installs a dependency or runs a script
  # from the tagged commit. The publish job repeats them — this is the earlier gate, not the only
  # one.
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Validate SDK tag and release target
        run: |
          TAG_NAME="${{ github.ref_name }}"
          TAG_VERSION="${TAG_NAME#sdk-v}"
          PKG_NAME=$(node -p "require('./packages/sdk/package.json').name")
          PKG_VERSION=$(node -p "require('./packages/sdk/package.json').version")
          PKG_PRIVATE=$(node -p "String(require('./packages/sdk/package.json').private)")

          if [ "$PKG_NAME" != "@fairux/sdk" ]; then
            echo "ERROR: packages/sdk/package.json name is $PKG_NAME"
            exit 1
          fi
          if [ "$PKG_PRIVATE" = "true" ]; then
            echo "ERROR: @fairux/sdk is private"
            exit 1
          fi
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "ERROR: SDK tag version ($TAG_VERSION) does not match packages/sdk/package.json ($PKG_VERSION)"
            exit 1
          fi
          # Strict SemVer, and beta specifically, from a script whose exit status a test can
          # read. The shell test this replaced looked for a letter after the hyphen, so it called
          # `1.0.0-1` a stable release; the version that replaced it accepted any prerelease under
          # a check named beta-only, so an rc reached a dependency install and a full dry-run pack
          # before anything refused it. This runs here, in the job every other job needs, before
          # any dependency is installed or any token can be minted.
          node scripts/check-sdk-release-version.mjs "$TAG_VERSION"

          git fetch origin main
          if ! git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
            echo "ERROR: tag commit (${{ github.sha }}) is not in main"
            exit 1
          fi

  sdk-smoke:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.18.0, 24.11.0]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:dry-run:sdk -- --tag "${{ github.ref_name }}"

  # Builds and audits the artifact. Deliberately unprivileged: `pnpm install` and `prepack` run
  # dependency and package lifecycle scripts, and this job holds no OIDC token and no write access,
  # so none of that code can mint a token, publish, or push to the repository. The privileged job
  # below only ever sees the finished tarball.
  prepare:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.11.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm release:check:sdk -- --tag "${{ github.ref_name }}"

      # Pack ONCE. This tarball is the exact artifact smoked, audited, published, and released.
      - name: Pack SDK tarball
        run: |
          pnpm --filter @fairux/sdk pack --pack-destination "$RUNNER_TEMP"
          mapfile -t TARBALLS < <(find "$RUNNER_TEMP" -maxdepth 1 -name "fairux-sdk-*.tgz" -type f | sort)
          if [ "${#TARBALLS[@]}" -ne 1 ]; then
            echo "ERROR: expected exactly one SDK tarball, got ${#TARBALLS[@]}"
            exit 1
          fi
          echo "PACKED_TARBALL=${TARBALLS[0]}" >> "$GITHUB_ENV"

      # One script owns the bundle's layout, so the paths written and the paths uploaded cannot
      # drift apart — they did, and the checksum step wrote into a directory nothing created.
      # `scripts/test-release-bundle-handoff.mjs` runs this and the verifier together in CI.
      - name: Assemble SDK release bundle
        run: |
          node scripts/assemble-release-bundle.mjs \
            --kind sdk \
            --tarball "$PACKED_TARBALL" \
            --manifest packages/sdk/package.json \
            --tag "${{ github.ref_name }}" \
            --commit "${{ github.sha }}" \
            --out "$RUNNER_TEMP/bundle" \
            --env-file "$GITHUB_ENV"

      - name: Smoke-test exact SDK tarball
        run: pnpm pack:smoke:sdk
        env:
          TARBALL: ${{ env.TARBALL }}
          EXPECTED_SHA256: ${{ env.SHA256 }}

      - name: Audit exact SDK tarball
        run: pnpm release:check:sdk -- --tag "${{ github.ref_name }}"
        env:
          TARBALL: ${{ env.TARBALL }}

      - name: Verify SDK tarball integrity
        run: |
          ACTUAL_SHA256=$(node -e 'const { createHash } = require("node:crypto"); const { readFileSync } = require("node:fs"); process.stdout.write(createHash("sha256").update(readFileSync(process.env.TARBALL)).digest("hex"));')
          if [ "$ACTUAL_SHA256" != "$SHA256" ]; then
            echo "ERROR: SHA-256 mismatch after smoke and audit"
            echo "Expected: $SHA256"
            echo "Actual:   $ACTUAL_SHA256"
            exit 1
          fi
          echo "SHA-256 verified: $ACTUAL_SHA256"

      # The bundle directory, exactly as assembled. Release notes are not in it: they become the
      # GitHub Release body, so the privileged job writes them from its own checkout rather than
      # publishing prose produced where lifecycle scripts ran.
      - name: Upload SDK release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fairux-sdk-tarball
          path: ${{ env.BUNDLE_DIR }}
          if-no-files-found: error
          retention-days: 30

  # The only privileged job. It installs nothing, builds nothing, and runs no package lifecycle:
  # it downloads the audited bundle, re-derives the digests itself, and publishes. Every script it
  # runs uses Node built-ins only, so no dependency tree is present while an OIDC token can be
  # minted.
  publish:
    runs-on: ubuntu-latest
    needs: [validate, sdk-smoke, prepare]
    # The environment is the approval gate and the OIDC identity, not a deployment target: this
    # publishes a tarball to a registry, it does not put a revision anywhere. `deployment: false`
    # keeps the required reviewer, the wait timer, the environment secrets, and the `environment`
    # claim npm's Trusted Publisher record matches, while leaving the repository's deployment
    # history untouched — which is where the failed `sdk-v0.1.0-beta.1` attempt ended up.
    environment:
      name: publish
      deployment: false
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.11.0

      - name: Verify publish Node runtime
        run: |
          node --version
          npm --version
          node -e 'const [major, minor] = process.versions.node.split(".").map(Number); if (major !== 24 || minor < 11) throw new Error("Expected Node 24.11.0 or newer, got " + process.versions.node);'

      - name: Download SDK release bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: fairux-sdk-tarball
          path: ${{ runner.temp }}/bundle

      # Trust the bundle only after re-deriving its identity here. The digests below are computed
      # in this job, not carried over as claims.
      # The bundle comes from a job that ran lifecycle code, so it is untrusted input. The
      # verifier derives the expected tag, dist-tag, tarball name, and file set from this clean
      # checkout, recomputes the digests from the bytes, and writes only inert values to
      # GITHUB_ENV. Its output is never `eval`ed: an earlier version emitted shell assignments,
      # and a crafted `distTag` executed arbitrary commands in this job.
      - name: Verify release bundle
        run: |
          node scripts/verify-release-bundle.mjs \
            --kind sdk \
            --bundle "$RUNNER_TEMP/bundle" \
            --tag "${{ github.ref_name }}" \
            --commit "${{ github.sha }}" \
            --package-json packages/sdk/package.json \
            --github-env "$GITHUB_ENV"

      # Identity is not content. Re-audit the packed bytes with this checkout's own auditor before
      # publishing them — no install, Node built-ins and system tar only.
      - name: Audit tarball contents from the trusted checkout
        env:
          TARBALL: ${{ env.TARBALL }}
        run: node packages/sdk/scripts/release-check.mjs --tag "${{ github.ref_name }}"

      - name: Re-verify tarball digest after the audit
        run: |
          ACTUAL=$(node -e 'const { createHash } = require("node:crypto"); const { readFileSync } = require("node:fs"); process.stdout.write(createHash("sha256").update(readFileSync(process.env.TARBALL)).digest("hex"));')
          if [ "$ACTUAL" != "$SHA256" ]; then
            echo "ERROR: tarball changed during the content audit"
            exit 1
          fi
          echo "SHA-256 stable across the audit: $ACTUAL"

      # Before the first npm network call, not only before the publish. `release-registry-plan`
      # runs `npm view`, so a static credential in this job's config would reach the registry on
      # that call — earlier than any check that used to run.
      - name: Verify npm Trusted Publishing prerequisites
        run: node scripts/check-trusted-publishing.mjs

      - name: Plan npm publication
        run: |
          node packages/sdk/scripts/release-registry-plan.mjs \
            --spec "$SPEC" \
            --shasum "$SHA1" \
            --integrity "$INTEGRITY" \
            --env-file "$GITHUB_ENV"

      # Again, immediately before the publish. The earlier run guarded the `npm view`; this one
      # fixes the state at the moment that matters, with nothing in between.
      - name: Re-verify npm Trusted Publishing prerequisites
        if: env.PUBLISH_NEEDED == 'true'
        run: node scripts/check-trusted-publishing.mjs

      - name: Publish SDK to npm
        run: |
          if [ "$PUBLISH_NEEDED" = "true" ]; then
            npm publish \
              --registry=https://registry.npmjs.org/ \
              --@fairux:registry=https://registry.npmjs.org/ \
              --ignore-scripts \
              --provenance \
              --access public \
              --tag "$DIST_TAG" \
              "$TARBALL"
          else
            echo "$SPEC already exists with matching digest; skipping npm publish."
          fi

      # `--wait-for-present` only here. The plan step above expects absence — the publish below is
      # what resolves it — so waiting there would spend the budget on a state the next step fixes.
      # After the publish, absence contradicts a write the registry accepted: `sdk-v0.1.0-beta.2`
      # published and this step, starting in the same second, read the version as absent and failed
      # the run while the package existed on npm. Only absence is retried; a digest mismatch still
      # fails on the first read.
      - name: Verify registry digest
        run: |
          node packages/sdk/scripts/release-registry-plan.mjs \
            --spec "$SPEC" \
            --shasum "$SHA1" \
            --integrity "$INTEGRITY" \
            --require-present \
            --wait-for-present

      # Written here, in the clean checkout, from its own manifest and from the values the bundle
      # verifier derived in this job. Every release-variable fact comes from one of those two
      # places — the generator makes no npm or GitHub query, and refuses what it cannot source,
      # which is why the dist-tag, the tarball name, and the checksum name are passed in rather
      # than re-derived here. The explanatory copy around them is version-controlled text in the
      # generator, pinned by its tests.
      # Before the notes, because the notes tell a reader to `npm install @fairux/sdk@next`. The
      # digest check above verifies the *version*; nothing verified the channel. That gap is only
      # reachable on a rerun — the version is already present with a matching digest, the publish is
      # skipped, and `next` may have moved in between — and every check in the run would pass while
      # the one instruction a consumer follows was wrong.
      - name: Verify SDK dist-tags
        run: |
          node packages/sdk/scripts/verify-sdk-dist-tags.mjs \
            --version "$VERSION" \
            --dist-tag "$DIST_TAG"

      # Before the notes, because the notes make a claim about provenance. The workflow passed
      # `--provenance` and never read `dist.attestations`, so "the npm package carries provenance"
      # was a statement about what the flag is supposed to do rather than about what the registry
      # ended up holding — the CLI path has had this since M1-R2 (issue #83).
      - name: Verify provenance metadata
        run: |
          node packages/sdk/scripts/verify-sdk-provenance.mjs --version "$VERSION"

      # The two `--verified-…` flags are passed only because the steps above actually ran and
      # passed. Without them the notes narrow those claims instead of asserting them, which is the
      # whole of issue #83: a generator that was never supplied evidence must not write a
      # past-tense sentence as if it had been.
      - name: Write SDK release notes
        run: |
          node packages/sdk/scripts/release-notes.mjs \
            --package-json packages/sdk/package.json \
            --tag "${{ github.ref_name }}" \
            --source-commit "${{ github.sha }}" \
            --dist-tag "$DIST_TAG" \
            --tarball "$TARBALL" \
            --checksum "$RUNNER_TEMP/bundle/release-sha256.txt" \
            --verified-credential-preflight \
            --verified-provenance-attested \
            --out "$RUNNER_TEMP/sdk-release-notes.md"

      # `@fairux/sdk ${VERSION}`, not `@fairux/sdk v${VERSION}`: the version already carries its
      # own prefix conventions, and the duplicated `v` shipped on `sdk-v0.1.0-beta.2`.
      # Before any `gh release` write, for the same reason as the CLI workflow: `gh` resolves its
      # target from the environment, so an inherited `GH_REPO` would send this write at a different
      # repository while every other check in the run passed.
      - name: Refuse an environment that could redirect the release write
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-release-target.mjs

      - name: Create SDK GitHub Release
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release edit "${{ github.ref_name }}" \
              --title "@fairux/sdk ${VERSION}" \
              --notes-file "$RUNNER_TEMP/sdk-release-notes.md" \
              --prerelease
            gh release upload "${{ github.ref_name }}" \
              "$TARBALL" \
              "$RUNNER_TEMP/bundle/release-sha256.txt" \
              --clobber
          else
            gh release create "${{ github.ref_name }}" \
              "$TARBALL" \
              "$RUNNER_TEMP/bundle/release-sha256.txt" \
              --title "@fairux/sdk ${VERSION}" \
              --notes-file "$RUNNER_TEMP/sdk-release-notes.md" \
              --prerelease
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      # The upload returning is not the Release being right. Every asset is downloaded again and
      # hashed against the bundle this run audited — the same distinction the registry half already
      # makes by re-reading the published digest.
      - name: Verify the published Release is the audited bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node scripts/verify-published-release.mjs \
            --tag "$RELEASE_TAG" \
            --checksum "$RUNNER_TEMP/bundle/release-sha256.txt" \
            --asset "$TARBALL"
