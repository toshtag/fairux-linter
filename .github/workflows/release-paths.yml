name: Release paths

# The two release-path checks a pull request can break, run on the pull request that breaks them.
#
# `release-contract.yml` is not on the pull-request critical path, so a change to the release path is
# not exercised until it merges. Reproduced on `main` before this workflow existed, by breaking each
# in turn and running the whole of `tests/unit`:
#
#   the bundle assembler writes the checksum into a directory the verifier does not read
#     → 49 files, 1462 tests pass; `test-release-bundle-handoff.mjs` fails
#   the CLI manifest ships a directory the packed contract does not expect
#     → 49 files, 1462 tests pass; `test-packed-artifact-contract.mjs` fails
#
# Both are invisible to the unit suite for the reason the scripts themselves give: the unit tests
# drive the pure contract with in-memory file lists and never touch a path, and the second half of
# each publish job does not execute until a tag fires.
#
# Not everything from that lane, and not by guess. `scoped-registry-routing` was measured too and is
# **not** here: removing the scope key from the release arguments already fails three unit tests in
# the pull-request lane, so a job for it would buy nothing. The full matrix — both Node floors, the
# whole suite on each, Windows, the preflights — still runs after the merge, where it is a rehearsal
# rather than a gate.
#
# ## The pack smokes, and why they moved
#
# They used to be in that post-merge rehearsal only, and three pull requests found out what that
# costs. Each passed every check it was given; together they added 3,150 bytes to the SDK browser
# bundle and pushed it past a ceiling `pack:smoke:sdk` measures, leaving `main` red for the next
# release rehearsal. Nothing in the pull-request lane can see it: the ceiling is measured on a bundle
# esbuild builds from a packed tarball, and no unit test packs one.
#
# So `package-smokes` runs both, and the `paths` below name what the tarballs are built *from* rather
# than only what describes them — a byte added to `@fairux/core` or `@fairux/rules` reaches the SDK
# bundle just as surely as a manifest edit does. Neither smoke asks the registry what is published:
# they used to run `npm publish --dry-run`, which answers `EPUBLISHCONFLICT` for a version already on
# npm, so this job went red on `main` between a release and the next bump. `pack:smoke:sdk` needs no
# network at all; `pack:smoke` installs its tarball into a clean project, which resolves the CLI's
# runtime dependencies the way a consumer would. Measured locally against a warm build:
# `pack:smoke:sdk` 5s, `pack:smoke` 7s, so the job is setup plus about half a minute and runs beside
# `ci.yml` rather than after it.
#
# It is a trade, like the one that took this lane off the critical path in the first place: a source
# pull request now waits for a job it did not before. The alternative is what just happened.
#
# `paths` still keeps this off pull requests it cannot help. A document, a corpus page, a test, or a
# workflow that is not a release workflow starts nothing here.

on:
  pull_request:
    paths:
      - ".github/workflows/publish-cli.yml"
      - ".github/workflows/publish-sdk.yml"
      - ".github/workflows/release-contract.yml"
      - ".github/workflows/release-paths.yml"
      - "scripts/**"
      - "apps/cli/scripts/**"
      - "packages/sdk/scripts/**"
      - "apps/cli/package.json"
      - "packages/sdk/package.json"
      # What the SDK tarball is built from, and not only what is listed in it: `sourcemap: true`
      # here publishes maps the release check refuses, and the ones tsdown emits embed private
      # source. `apps/cli/tsdown.config.ts` is deliberately absent — the CLI ships maps on purpose
      # and `apps/cli/test/cli-source-map-audit.test.ts` audits the built ones in the lane already.
      - "packages/sdk/tsdown.config.ts"
      # What the two tarballs are *built from*, not only what describes them. The SDK browser bundle
      # is built from every package it re-exports, so a byte added to `@fairux/core` or
      # `@fairux/rules` lands in the bundle whose size `pack:smoke:sdk` measures.
      - "packages/*/src/**"
      - "apps/cli/src/**"

permissions:
  contents: read

env:
  # The version the runner image already caches, as in `ci.yml`. One version rather than the release
  # matrix: this is the early warning, and `release-contract.yml` runs both floors after the merge.
  PR_LANE_NODE: 22.23.1

jobs:
  release-paths:
    # `ubuntu-latest`, matching the jobs this mirrors in `release-contract.yml`. A pull-request check
    # that ran the release path on a different architecture from the one rehearsing it would be a
    # second gap rather than a smaller one.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.PR_LANE_NODE }}
          cache: pnpm
      # Nothing here publishes, tags, or writes to a registry: both scripts assemble and verify
      # local artifacts in a temporary directory, which is why they can run on a pull request at all.
      - run: node scripts/test-release-bundle-handoff.mjs
      - run: pnpm install --frozen-lockfile
      - run: node scripts/test-packed-artifact-contract.mjs
      # A script that wrote into the worktree would pass here and fail the next checkout. Both
      # halves, as in `ci.yml`: `git diff` sees a modified tracked file and an untracked one only
      # shows up in `status`, and these scripts pack tarballs into directories they create.
      - name: Assert the release-path checks left the worktree clean
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"

  # Both tarballs, packed and inspected locally. The same scripts `release-contract.yml` runs after a
  # merge and `pnpm verify:full` runs before a pull request — one implementation, three callers.
  package-smokes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.PR_LANE_NODE }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm pack:smoke
      - run: pnpm pack:smoke:sdk
      # Each smoke packs into a directory it creates, so both halves again: `git diff` sees a
      # modified tracked file and an untracked one only shows up in `status`.
      - name: Assert the pack smokes left the worktree clean
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
