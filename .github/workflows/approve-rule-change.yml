name: Rule change approval

# What a maintainer does to approve a rule change: run this, read the summary, click Approve.
#
# It replaces a flow that asked for a written comment and then asked somebody to transcribe its URL,
# its author, its UTC date, a 64-character fingerprint, and a 64-character digest into JSON by hand.
# Six values copied between two systems is six chances to copy one wrongly, and the check that would
# catch a bad copy is the same check the copying exists to satisfy.
#
# The gate is not relaxed. It moves: GitHub's protected environment records *who* approved and
# *when*, and this workflow records *what* — measured from the built packages, never typed.
#
# `workflow_dispatch` only, so the definition that runs is always the one on the default branch. A
# pull request cannot change how its own approval works.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to approve
        required: true
        type: number
      approve_tooling_change:
        description: >-
          Run the approval tooling FROM THE BRANCH. Only for a pull request that changes the tooling
          itself. Read the tooling diff printed in the summary before approving.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  # Everything a maintainer needs in order to decide, computed before anyone is asked to decide.
  # Read-only: this job installs dependencies and runs repository scripts, so it gets no write
  # access and no ability to record anything.
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      head_sha: ${{ steps.pr.outputs.head_sha }}
      head_ref: ${{ steps.pr.outputs.head_ref }}
      review_content_sha256: ${{ steps.measure.outputs.review_content_sha256 }}
      detection_digest: ${{ steps.measure.outputs.detection_digest }}
      prepared_rule_ids: ${{ steps.measure.outputs.prepared_rule_ids }}
    steps:
      - name: Read the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          pr="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json state,isCrossRepository,headRefName,headRefOid,title,url)"

          state="$(jq -r '.state' <<<"$pr")"
          cross="$(jq -r '.isCrossRepository' <<<"$pr")"
          # A fork's branch cannot be written to with this token, and approving code from one that
          # this workflow would then push to is a different trust question entirely.
          if [ "$state" != "OPEN" ]; then echo "PR #$PR_NUMBER is $state, not OPEN" >&2; exit 1; fi
          if [ "$cross" != "false" ]; then echo "PR #$PR_NUMBER comes from a fork" >&2; exit 1; fi

          head_sha="$(jq -r '.headRefOid' <<<"$pr")"
          head_ref="$(jq -r '.headRefName' <<<"$pr")"
          # Both cross a job boundary through `$GITHUB_OUTPUT`, where a newline would let one value
          # define another. A branch name is chosen by whoever opened the pull request, so it is
          # checked against a conservative shape rather than trusted for being same-repository.
          case "$head_sha" in
            *[!0-9a-f]* | "" ) echo "head SHA is not 40 hex characters: $head_sha" >&2; exit 1 ;;
          esac
          [ "${#head_sha}" -eq 40 ] || { echo "head SHA is not 40 characters" >&2; exit 1; }
          case "$head_ref" in
            -* | *[!A-Za-z0-9._/-]* | "" )
              echo "refusing an unusual branch name: $head_ref" >&2; exit 1 ;;
          esac
          {
            echo "head_sha=$head_sha"
            echo "head_ref=$head_ref"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Rule change approval — PR #$PR_NUMBER"
            echo
            echo "**$(jq -r '.title' <<<"$pr")**"
            echo
            echo "- $(jq -r '.url' <<<"$pr")"
            echo "- head: \`$(jq -r '.headRefOid' <<<"$pr")\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0

      # The governance scripts come from the default branch, never from the branch being approved.
      #
      # Two reasons, and the first one is how this was found: a pull request opened before the
      # approval tooling existed does not contain it, and the run died on a missing module. The
      # second is the one that matters — measuring and recording an approval with code the change
      # itself supplies would let a branch decide what its own approval says.
      #
      # The rules are the pull request's. The tool that reads them is not.
      #
      # Except for a pull request that changes the tooling, which cannot be approved by a tool that
      # predates it — the deadlock is real, and pretending otherwise would push somebody to dispatch
      # this workflow on the branch's own ref, where the branch controls the definition too and
      # nobody is told. `approve_tooling_change` is that escape hatch, made explicit: off by default,
      # gated on the same human approval, and it prints the tooling diff into the summary the
      # maintainer is reading when they decide.
      - name: Take the approval tooling from the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          APPROVE_TOOLING_CHANGE: ${{ inputs.approve_tooling_change }}
        run: |
          set -euo pipefail
          # Not `--depth=1`: a shallow default branch has no history in common with the pull
          # request, and the diff below then fails with `no merge base`. The checkout above already
          # fetched the full history, so this costs one ref.
          git fetch --quiet origin "$DEFAULT_BRANCH"
          if [ "$APPROVE_TOOLING_CHANGE" = "true" ]; then
            {
              echo "## :warning: Running the branch's approval tooling"
              echo
              echo "\`approve_tooling_change\` was set, so the code that measures and records this"
              echo "approval comes from the pull request, not from \`$DEFAULT_BRANCH\`. **Read this diff.**"
              echo "A change here changes what every future approval means."
              echo
              echo '```diff'
              git diff "origin/$DEFAULT_BRANCH...HEAD" -- packages/rules/scripts | head -400 \
                || echo "(diff unavailable — read it on the pull request)"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git checkout "origin/$DEFAULT_BRANCH" -- packages/rules/scripts
          git status --short packages/rules/scripts

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.11.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # The values the packet will carry, measured from the build. A maintainer reads them; nobody
      # copies them.
      - name: Measure what an approval would cover
        id: measure
        run: |
          set -euo pipefail
          node packages/rules/scripts/record-approval.mjs --check > facts.json
          {
            echo "review_content_sha256=$(jq -r '.reviewContentSha256' facts.json)"
            echo "detection_digest=$(jq -r '.detectionDigest' facts.json)"
            echo "prepared_rule_ids=$(jq -c '.preparedRuleIds' facts.json)"
          } >> "$GITHUB_OUTPUT"

      # What changed, in the terms the review record uses. A rule diff and the corpus before/after
      # are what the decision is actually about; the hashes are what makes the decision binding.
      - name: Summarise the change
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          {
            echo
            echo "### Rules whose review is \`prepared\`"
            echo
            jq -r '.preparedRuleIds[] | "- `\(.)`"' facts.json
            echo
            echo "### Versions this approval would cover"
            echo
            echo "| Rule | Version |"
            echo "| --- | --- |"
            jq -r '.approvedRules[] | "| `\(.ruleId)` | \(.ruleVersion) |"' facts.json
            echo
            echo "### Values it would record"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| reviewContentSha256 | \`$(jq -r '.reviewContentSha256' facts.json)\` |"
            echo "| detectionDigest | \`$(jq -r '.detectionDigest' facts.json)\` |"
            echo
            echo "### Detection quality on the corpus"
            echo
            echo '```'
            pnpm --silent eval:corpus:check || true
            echo '```'
            echo
            echo "### Rule diff against \`$DEFAULT_BRANCH\`"
            echo
            echo '```diff'
            # `|| echo` rather than `set -e` taking the job: a maintainer who cannot see the diff
            # should be told that, and then still get the hashes and the corpus result that decide
            # whether to approve.
            git diff "origin/$DEFAULT_BRANCH...HEAD" -- \
              packages/rules/src packages/core/src/page-context.ts 2>/dev/null | head -300 \
              || echo "(diff unavailable — read it on the pull request)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # "Nothing prepared" is not the same as "nothing to approve". A change to how the detection
      # digest is computed needs a fresh approval and moves no review record — found the first time
      # one was submitted, when this step refused a run that was genuinely needed.
      #
      # What makes a run unnecessary is the packet already agreeing with the repository *and* no
      # record waiting on a decision. That is the condition, and nothing weaker.
      - name: Refuse a run with nothing to approve
        run: |
          set -euo pipefail
          count="$(jq -r '.preparedRuleIds | length' facts.json)"
          agrees="$(jq -r '.agrees' facts.json)"
          if [ "$count" -eq 0 ] && [ "$agrees" = "true" ]; then
            echo "The packet already matches this commit and no review record is \`prepared\`;" >&2
            echo "there is nothing here to approve." >&2
            exit 1
          fi
          if [ "$count" -eq 0 ]; then
            echo "No review record is \`prepared\`, but the recorded digest no longer matches the"
            echo "repository. This run approves the current detection state."
          fi

  # Gated by a protected environment whose required reviewer is the maintainer. Nothing below runs
  # until that approval exists, and GitHub — not this file — decides who may give it.
  approve:
    runs-on: ubuntu-latest
    needs: [prepare]
    environment:
      name: rule-maintenance-approval
      deployment: false
    permissions:
      contents: write
      # For the run's own environment-approval record, which is where the approver comes from.
      actions: read
      pull-requests: read
    steps:
      # The stale-approval guard. An approval can sit pending for hours; if the branch moved in that
      # time, the approval was for something else. Checked before anything is written, and again
      # before anything is pushed.
      - name: Confirm the branch has not moved
        id: recheck
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED: ${{ needs.prepare.outputs.head_sha }}
        run: |
          set -euo pipefail
          actual="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid \
            --jq '.headRefOid')"
          if [ "$actual" != "$EXPECTED" ]; then
            echo "Branch moved while approval was pending: expected $EXPECTED, found $actual." >&2
            echo "Nothing recorded. Re-run this workflow against the new head." >&2
            exit 1
          fi
          echo "head_sha=$actual" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.prepare.outputs.head_ref }}
          fetch-depth: 0

      # The governance scripts come from the default branch, never from the branch being approved.
      #
      # Two reasons, and the first one is how this was found: a pull request opened before the
      # approval tooling existed does not contain it, and the run died on a missing module. The
      # second is the one that matters — measuring and recording an approval with code the change
      # itself supplies would let a branch decide what its own approval says.
      #
      # The rules are the pull request's. The tool that reads them is not.
      #
      # Except for a pull request that changes the tooling, which cannot be approved by a tool that
      # predates it — the deadlock is real, and pretending otherwise would push somebody to dispatch
      # this workflow on the branch's own ref, where the branch controls the definition too and
      # nobody is told. `approve_tooling_change` is that escape hatch, made explicit: off by default,
      # gated on the same human approval, and it prints the tooling diff into the summary the
      # maintainer is reading when they decide.
      - name: Take the approval tooling from the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          APPROVE_TOOLING_CHANGE: ${{ inputs.approve_tooling_change }}
        run: |
          set -euo pipefail
          # Not `--depth=1`: a shallow default branch has no history in common with the pull
          # request, and the diff below then fails with `no merge base`. The checkout above already
          # fetched the full history, so this costs one ref.
          git fetch --quiet origin "$DEFAULT_BRANCH"
          if [ "$APPROVE_TOOLING_CHANGE" = "true" ]; then
            {
              echo "## :warning: Running the branch's approval tooling"
              echo
              echo "\`approve_tooling_change\` was set, so the code that measures and records this"
              echo "approval comes from the pull request, not from \`$DEFAULT_BRANCH\`. **Read this diff.**"
              echo "A change here changes what every future approval means."
              echo
              echo '```diff'
              git diff "origin/$DEFAULT_BRANCH...HEAD" -- packages/rules/scripts | head -400 \
                || echo "(diff unavailable — read it on the pull request)"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git checkout "origin/$DEFAULT_BRANCH" -- packages/rules/scripts
          git status --short packages/rules/scripts

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.11.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Who approved is **not** `github.actor`. On a `workflow_dispatch`, that is whoever pressed Run
      # workflow, and the person who presses it and the person who approves the environment need not
      # be the same — recording the wrong one would be worse than the manual flow this replaces,
      # because it would look measured. The environment reviewer comes from the run's own approval
      # record, and the job fails closed if there is not exactly one.
      - name: Read who approved the environment
        id: approver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          approvals="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals")"
          approver="$(jq -r '
            [ .[] | select(.state == "approved") | .user.login ] | unique | .[]
          ' <<<"$approvals")"
          count="$(wc -l <<<"$approver" | tr -d " ")"
          if [ -z "$approver" ] || [ "$count" -ne 1 ]; then
            echo "expected exactly one environment approver, found: ${approver:-none}" >&2
            exit 1
          fi
          case "$approver" in
            *[!A-Za-z0-9-]* ) echo "unexpected login: $approver" >&2; exit 1 ;;
          esac
          echo "login=$approver" >> "$GITHUB_OUTPUT"

      # Who and when come from GitHub. What comes from the build. Neither comes from a person.
      - name: Record the approval
        env:
          APPROVAL_TARGET_COMMIT: ${{ steps.recheck.outputs.head_sha }}
          APPROVED_BY: ${{ steps.approver.outputs.login }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          APPROVED_AT="$(date -u +%Y-%m-%d)" \
            node packages/rules/scripts/record-approval.mjs

      # The catalog embeds each rule's review status, approver, and date, so recording an approval
      # makes it stale. Found by the first approval that got this far: the packet was valid, the gate
      # for it passed, and `rules:catalog:check` failed on two generated files.
      - name: Regenerate the catalog the approval just changed
        run: pnpm rules:catalog

      # A branch whose approval commit fails `pnpm lint` is a branch nobody can merge, and the
      # approval is what put it there. The writer formats its own output; this is the check that the
      # rest of the commit is clean too.
      - name: Verify the approval commit lints
        run: pnpm lint

      # The packet has to satisfy the gate it was written for. If it does not, the approval is not
      # pushed — a half-recorded approval is worse than none, because it looks like one.
      - name: Verify the gate now passes
        run: |
          set -euo pipefail
          pnpm rules:reviews:check
          pnpm rules:reviews:check:approved
          pnpm rules:catalog:check

      - name: Push the approval commit
        env:
          EXPECTED: ${{ steps.recheck.outputs.head_sha }}
          HEAD_REF: ${{ needs.prepare.outputs.head_ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Fail closed once more: between the recheck and here, the workflow ran an install and a
          # build from the pull request's own code.
          git fetch origin -- "$HEAD_REF"
          actual="$(git rev-parse "origin/$HEAD_REF")"
          if [ "$actual" != "$EXPECTED" ]; then
            echo "Branch moved during the run: expected $EXPECTED, found $actual. Nothing pushed." >&2
            exit 1
          fi

          # Only the two review files. The scripts restored from the default branch are working-tree
          # state for this run and must not ride along into the pull request.
          git restore --source=HEAD --staged --worktree -- packages/rules/scripts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/rules/reviews/maintainer-approval.json \
            packages/rules/reviews/built-in-rule-reviews.json \
            packages/rules/src/generated/reviewed-governance.ts \
            docs/generated/rule-catalog.json \
            docs/rules.md
          # One `-m` per paragraph: git joins them with blank lines, and a folded string here would
          # either carry the block's indentation into the message or leave the YAML block early.
          git commit \
            -m "chore(rules): record the maintainer approval for this rule change" \
            -m "Written by the Rule change approval workflow after a protected-environment review. Who and when come from GitHub, what comes from the build, and no value in the packet was typed by a person." \
            -m "Run: $RUN_URL"
          git push origin -- "HEAD:$HEAD_REF"

      # `GITHUB_TOKEN` pushes deliberately do not trigger workflows, which is a loop guard and not a
      # bug. So the pull request's checks still show the pre-approval run, and somebody has to ask
      # for them again. Said here rather than discovered on the pull request.
      - name: Say what is left to do
        run: |
          {
            echo "### Recorded"
            echo
            echo "The approval commit is pushed to \`${{ needs.prepare.outputs.head_ref }}\`."
            echo
            echo "**Re-run the pull request's checks.** A push made with \`GITHUB_TOKEN\` does not"
            echo "trigger workflows, so the checks on the pull request are still the pre-approval"
            echo "run. Re-run them, then merge normally — this workflow does not merge anything."
          } >> "$GITHUB_STEP_SUMMARY"
