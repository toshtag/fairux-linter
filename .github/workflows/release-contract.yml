name: Release contract

# The release and platform half of CI, split out of `ci.yml` so a contributor does not wait on it.
#
# Everything here rehearses something that only happens on a tag push or on a platform this
# repository is not developed on. None of it can be broken by a change without that change also
# being on `main` — so it runs after the merge, not before it, where a failure is an issue to open
# rather than 90 seconds added to every pull request. `workflow_dispatch` is what a maintainer runs
# before tagging.
#
# The publish workflows do not depend on this: `publish-cli.yml` and `publish-sdk.yml` run their own
# release checks, packed smoke, and audits against the tag they are publishing. What this lane buys
# is finding out on the day rather than at the tag.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only everywhere. Nothing here publishes, tags, or pushes; the token should not be able to.
permissions:
  contents: read

# Only the newest commit on `main` matters — an older run would report the platform state of a tree
# nobody can tag any more.
concurrency:
  group: release-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # How long the lane a contributor waits on actually takes, against the budget it is allowed.
  #
  # `tests/unit/workflows/ci-budget.test.ts` bounds that lane's shape and runs on every pull request;
  # it cannot see the one way CI gets slower without anyone adding anything, which is the suite
  # growing. Fifty new rule tests do not change a step count. They change this number.
  #
  # Here rather than in `ci.yml`: it reads the API, it describes a trend rather than the change in
  # front of you, and a check that needs a token and a network round trip has no business on the
  # path somebody is waiting on.
  ci-budget:
    runs-on: ubuntu-latest
    # `actions: read` is what listing workflow runs needs. Naming any job-level permission sets
    # every other one to `none`, so `contents: read` is restated rather than inherited.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # No install: Node built-ins and `fetch`, exactly like the two handoff jobs below.
      - run: node scripts/check-ci-budget.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The claim `docs/reference/platforms.md` makes about both Node.js floors: "the whole suite".
  #
  # It was not true of 24.11.0 and never had been. The suite ran in one place — `ci.yml`'s test job,
  # pinned to 22.18.0 — and every job that did carry the floor matrix packed a tarball or rehearsed
  # a release. So a document that exists to say what "supported" means named a version nothing had
  # executed the tests on, and `supported-platforms-contract.test.ts`, which the page says asserts
  # every number on it, was comparing version *strings* across manifests and workflows. Two checks
  # that each looked like the other one's guarantee.
  #
  # Unsharded on purpose: `ci.yml` splits the suite four ways because a contributor is waiting, and
  # nobody is waiting on this. One job per floor is also what the contract test can read as "the
  # whole suite ran on this version" without having to reason about whether a set of shards covered
  # it.
  suite-on-both-floors:
    name: suite-on-both-floors (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.18.0, 24.11.0]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:built
      - name: Assert the tests left the worktree clean
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"

  # The publish workflows only run on a tag push, so nothing in them executes until a release is
  # already under way. This runs their two artifact-handoff executables here, where a mistake is a
  # red check rather than a failed release.
  release-bundle-handoff:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.18.0, 24.11.0]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      # No install: both scripts use Node built-ins only, exactly as they do in the publish job.
      - run: node scripts/test-release-bundle-handoff.mjs

  # Asserting that `--registry` is on the command line does not establish where npm sends the
  # request: a scoped package resolves through `@fairux:registry` first. This runs npm against two
  # local servers and checks which one is asked. No external network, no registry, no credentials.
  scoped-registry-routing:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.18.0, 24.11.0]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      # No install: the script uses Node built-ins and the npm that ships with this Node.
      - run: node scripts/test-scoped-registry-routing.mjs

  # The outer handoff job above needs no install. This one packs both publishable packages for
  # real and runs the publish jobs' own auditors against them — and against tarballs rebuilt with
  # a duplicate member, a dot-segment alias, an injected manifest field, and a dynamic import.
  # Every finding in the fifth review round lived in this half of the workflow.
  packed-artifact-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.18.0, 24.11.0]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No registry, no OIDC, no publish — only pack, assemble, verify, audit.
      - run: node scripts/test-packed-artifact-contract.mjs

  # The build-output contract from issue #57, from a clean checkout on both supported Node.js
  # floors. `verify` in `ci.yml` proves the contract holds once; this job additionally proves the
  # build is idempotent — that a second build changes nothing — which is what makes repeated
  # release verification and the release-time write audit trustworthy.
  build-output-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.18.0, 24.11.0]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and record the artifact digest
        run: |
          pnpm build
          pnpm check:build-output
          find packages apps -path '*/dist/*' -type f | sort | xargs sha256sum > "$RUNNER_TEMP/build-1.txt"
      - name: Assert the worktree is clean after a build
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Assert lint succeeds after a build
        run: pnpm lint
      - name: Rebuild and assert the artifacts are identical
        run: |
          pnpm build
          pnpm check:build-output
          find packages apps -path '*/dist/*' -type f | sort | xargs sha256sum > "$RUNNER_TEMP/build-2.txt"
          diff -u "$RUNNER_TEMP/build-1.txt" "$RUNNER_TEMP/build-2.txt"
          git diff --exit-code
          test -z "$(git status --porcelain)"

  # Publish viability, from a checkout with nothing built. The smoke test itself deletes every dist
  # and packs from a clean state (prepack must rebuild), then installs
  # the tarball into a temp dir and runs HTML/JSX/TSX + an explicit fairux.config.ts. Run on the
  # exact supported Node.js floors, so the declared range is exercised without floating major
  # aliases. Node 20 is EOL, so it's no longer a supported runtime (see P10-T3).
  pack-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.18.0, 24.11.0]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm pack:smoke
      - name: Assert the worktree is clean afterwards
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"

  # The same contract as `pack-smoke`, on the Windows platform target required by M1-R3.
  # Not a reduced Windows variant: `pnpm pack:smoke` runs the identical archive audit and the
  # identical installed-CLI contract, so a behaviour that holds on Linux and not on Windows is a
  # failure here rather than something nobody looks at. Until this job existed the packed CLI had
  # never been installed on Windows at all — the first consumer to try would have been the report.
  #
  # `config-windows` below is not made redundant by this: it checks config identity and path
  # semantics from the workspace, where a failure is attributable to a source file. This job checks
  # the same behaviours through a published-and-installed artifact, where a failure means the thing
  # users would have downloaded is broken.
  pack-smoke-windows:
    name: pack-smoke-windows (Node ${{ matrix.node-version }})
    runs-on: windows-latest
    timeout-minutes: 25
    # Stated here rather than left to the repository default: naming any job-level permission sets
    # every other one to `none`, so this is what fixes the job's effective token to read-only. An
    # absent block would inherit whatever the repository or a future workflow-level default grants,
    # and "this job cannot write" would be a property of settings rather than of the workflow.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.18.0, 24.11.0]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      # As in `ci.yml`'s `verify`: assert the resolved pnpm is the one `packageManager` names before
      # it gets to resolve the lockfile. On Windows that pnpm is a `.cmd` shim, which is the case
      # this job exists to keep honest.
      - run: node scripts/check-pnpm-selection.mjs
      - run: pnpm install --frozen-lockfile
      # The Windows-only branches of the shared runner and the bin resolver: launching a real
      # `.cmd` through `cmd.exe`, the quoting rule that goes with it, and `PATHEXT` resolution.
      # `pnpm pack:smoke` drives those branches too, but only along the paths it happens to take;
      # these pin them. Not a substitute for the packed smoke below, which still runs in full.
      - name: Run the Windows-only runner and bin-resolution cases
        run: pnpm exec vitest run tests/unit/run-command.test.ts tests/unit/installed-cli-bin-path.test.ts
      - run: pnpm pack:smoke
      # `bash`, not the runner's default `pwsh`: GitHub's bash wrapper runs with `set -e`, so the
      # `git diff` below stops the step when it fails. Under `pwsh` only the last command's status
      # is reported, and a dirty worktree caught by the first line would pass silently.
      - name: Assert the worktree is clean afterwards
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"

  sdk-pack-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.18.0, 24.11.0]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm pack:smoke:sdk
      - name: Assert the worktree is clean afterwards
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"

  # The CLI's release path, rehearsed on every commit that reaches `main`. It had no equivalent of
  # the SDK job below, so it was first exercised end to end by a real tag — which is when a mistake
  # costs a consumed tag rather than a red check. Packs, smokes the exact tarball, audits it against the
  # release contract, renders the release notes through the workflow's own invocation, and runs
  # `npm publish --dry-run`. No registry read: `fairux` is not published yet, and that absence is
  # the correct external state rather than something to assert around.
  cli-release-preflight:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.18.0, 24.11.0]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dry-run the CLI release path
        run: |
          CLI_VERSION=$(node -p "require('./apps/cli/package.json').version")
          pnpm release:dry-run:cli -- --tag "v$CLI_VERSION"
      - name: Assert the worktree is clean afterwards
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"

  sdk-release-preflight:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.18.0, 24.11.0]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dry-run SDK release path
        run: |
          SDK_VERSION=$(node -p "require('./packages/sdk/package.json').version")
          pnpm release:dry-run:sdk -- --tag "sdk-v$SDK_VERSION"
      - name: Assert the worktree is clean afterwards
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"

  rule-pack-author-example:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.18.0, 24.11.0]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:rule-pack-author-example

  # Targeted Windows job: verify config boundary behaviour on the native Windows filesystem.
  # Full pack smoke is not duplicated here; this job focuses on config identity, path semantics,
  # and CLI/VS Code integration that must work on the platform users actually run.
  config-windows:
    name: config-windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.18.0
          cache: pnpm
      # The same assertion as `ci.yml`'s `verify`, on the platform where pnpm is a `.cmd` shim
      # rather than a symlink — the one place the action's resolution could differ unnoticed.
      - run: node scripts/check-pnpm-selection.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "@fairux/config-node..." build
      - run: pnpm exec vitest run packages/config-node/test
      - run: pnpm --filter "fairux..." build
      - run: pnpm exec vitest run apps/cli/test/config.test.ts
      - run: pnpm exec vitest run apps/cli/test/cli-security.test.ts
      # Whether one path is the same file as another, and whether a replaced file keeps being what
      # it was, are answered by the filesystem — and Windows answers differently. Case-insensitive
      # paths, a rename that is not POSIX `rename(2)`, no `nlink` worth trusting, and no execute bit.
      # The assertions that only mean something on POSIX are skipped inside these files; everything
      # driven through injected filesystem operations runs here in full.
      # One `vitest` call per file: passing three or more path filters resolves to no test files at
      # all, which would pass this step while running nothing.
      - name: Write-safety behaviour on the native Windows filesystem
        run: |
          pnpm exec vitest run apps/cli/test/artifact-state-transitions.test.ts
          pnpm exec vitest run apps/cli/test/file-replace.test.ts
          pnpm exec vitest run apps/cli/test/fix-write-safety.test.ts
          pnpm exec vitest run apps/cli/test/fix-source-semantics.test.ts
          pnpm exec vitest run apps/cli/test/output-path-safety.test.ts
      - run: pnpm exec vitest run apps/vscode-extension/test
