<!doctype html>
<html lang="ja">
<head><title>Cookie 同意設定</title></head>
<body>
  <main>
    <h1>同意設定</h1>
    <p>当サイトでは Cookie を利用して広告効果を測定します。</p>
    <form>
      <label><input type="checkbox" name="analytics"> 分析用 Cookie を許可する</label>
      <label><input type="checkbox" name="marketing" checked> キャンペーンのお知らせをメールで受け取る</label>
      <button type="submit">設定を保存</button>
      <button type="button">すべて拒否</button>
    </form>
  </main>
</body>
</html>
