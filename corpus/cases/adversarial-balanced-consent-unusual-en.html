<!doctype html>
<html lang="en">
<head><title>Reader settings</title></head>
<body>
  <main>
    <h2>How this site measures reading</h2>
    <p>We can count which articles are opened. Choose once; either choice is remembered
       for a year and can be changed from the footer at any time.</p>
    <form>
      <label><input type="radio" name="measure" value="off"> Count nothing</label>
      <label><input type="radio" name="measure" value="on"> Count article opens</label>
      <button type="submit">Save this choice</button>
    </form>
    <p>Neither option unlocks or withholds any part of the site.</p>
  </main>
</body>
</html>
