<!doctype html>
<html lang="en">
<head><title>Cookie and marketing consent</title></head>
<body>
  <main>
    <h1>Before you continue</h1>
    <p>We use cookies to personalise content and to measure our advertising.</p>
    <form>
      <label><input type="checkbox" name="analytics"> Allow analytics cookies</label>
      <label><input type="checkbox" name="marketing" checked> Email me product offers and promotions</label>
      <button type="submit">Save choices</button>
      <button type="button">Reject all</button>
    </form>
  </main>
</body>
</html>
