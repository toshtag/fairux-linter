<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FairUX</title>
    <style>
      body { font: 13px/1.4 system-ui, sans-serif; width: 360px; margin: 0; padding: 12px; color: #222; }
      h1 { font-size: 15px; margin: 0 0 8px; }
      h2.group-heading { font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: #555; margin: 10px 0 4px; }
      #disclaimer { color: #666; font-size: 11px; margin: 0 0 10px; }
      button { font: inherit; padding: 6px 12px; cursor: pointer; border: 1px solid #888; border-radius: 6px; background: #f6f6f6; }
      /* The focus ring is never removed anywhere in this file, and a test checks that it is not. A
         keyboard user's only way of knowing where they are is this ring, and a tool that reports on
         dark patterns cannot ship a control that hides its own focus. */
      :focus-visible { outline: 3px solid #1971c2; outline-offset: 2px; }
      #status { color: #666; margin: 8px 0; min-height: 1em; }
      .summary { font-weight: 600; margin: 8px 0; }
      .error { color: #c92a2a; }
      ul.findings { list-style: none; margin: 0 0 8px; padding: 0; }
      li.finding { border: 1px solid #eee; border-left-width: 4px; border-radius: 4px; margin: 4px 0; }
      li.finding > div, li.finding > .finding-head { padding: 0 8px; }
      li.finding > div:first-child { padding-top: 6px; }
      li.finding > div:last-child { padding-bottom: 6px; }
      /* The whole row is the button, so it has to look like the row and not like a button. It keeps
         the focus ring above, which is the part that matters. */
      button.finding-activate { display: block; width: 100%; text-align: left; font: inherit; color: inherit;
        background: none; border: 0; border-radius: 4px; padding: 6px 8px; cursor: pointer; }
      button.finding-activate:hover { background: #fafafa; }
      button.finding-activate .finding-head, button.finding-activate .desc, button.finding-activate .rec { display: block; }
      .finding-head { display: flex; gap: 6px; align-items: baseline; }
      .badge { text-transform: uppercase; font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 3px; background: #eee; }
      .title { font-weight: 600; }
      .desc { color: #333; margin: 3px 0; }
      .rec { color: #555; font-size: 12px; }
      .sev-high { border-left-color: #d6336c; }
      .sev-medium { border-left-color: #e8590c; }
      .sev-low { border-left-color: #f59f00; }
      .sev-info { border-left-color: #adb5bd; }
    </style>
  </head>
  <body>
    <h1>FairUX</h1>
    <p id="disclaimer"></p>
    <button id="scan" type="button">Scan this page</button>
    <!-- A live region: replacing its text announces progress and outcomes without moving focus,
         which is the only way a keyboard or screen reader user learns that a scan finished or that
         a highlight found nothing. `polite` so it waits for a pause rather than interrupting. -->
    <p id="status" role="status" aria-live="polite"></p>
    <div id="results"></div>
    <script src="popup.js"></script>
  </body>
</html>
